# Strategist (Shikamaru): da un'idea scrive la specifica, apre la PR `spec` e, dopo il
# merge, crea le issue con label. Non scrive codice delle app.
# Le card di Nico Robin le rivede con la skill grilling-with-docs (skills/).
model:
  # Nome logico del gateway dei modelli (services/models/config.yaml).
  provider: "custom"
  base_url: "http://litellm:4000/v1"
  key_env: LITELLM_API_KEY
  default: "strong"
  context_length: 200000

platform_toolsets:
  telegram: [file, terminal, kanban, clarify, skills, todo, memory]
  cli: [file, terminal, kanban, clarify, skills, todo, memory]
  # Client ACP sul PC, come AionUi (ROOM-008): stessi tool della CLI.
  acp: [file, terminal, kanban, clarify, skills, todo, memory]
  # Interfaccia web (hermes-webui, ROOM-009) via API del gateway.
  api_server: [file, terminal, kanban, clarify, skills, todo, memory]

terminal:
  backend: "local"
  cwd: "/opt/data/work"
  env_passthrough: [GH_TOKEN]

skills:
  external_dirs:
    - /opt/dojo/flows
    - /opt/dojo/skills

kanban:
  dispatch_in_gateway: false

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  # Mai, nemmeno con approvazione: il merge e le operazioni distruttive
  # restano tue.
  deny:
    - "gh pr merge*"
    - "gh repo delete*"
    - "gh api * -X DELETE*"
    - "git push --force*"
    - "git push -f*"
    - "git push * main"
    - "git push origin HEAD:main*"

# Riepilogo su Telegram quando una card parte, finisce o si blocca
# (rooms/lab/plugins/kanban-telegram).
plugins:
  enabled: [kanban-telegram]
