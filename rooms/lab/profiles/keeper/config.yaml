# Keeper (Kakashi Hatake): tiene allineati i fork di ron1n all'upstream (ROOM-017). Un cron a orario
# (cron.yaml) lo fa partire solo quando upstream ha una release nuova; lui unisce, adatta, traduce e
# apre la PR. Non fa merge né release: le decide il workflow `fork-sync` del fork, a CI verde.
model:
  # Abbonamento Claude (MODELS-006). Si cambia da Hermes (`hermes model`,
  # dashboard o WebUI) e l'aggiornamento dell'immagine non lo tocca
  # (MODELS-007, ROOM-012).
  provider: "claude-subscription-directsdk-experimental"
  default: "sonnet"
  context_length: 200000

# Una chiamata appesa senza output non tiene ferma una sincronizzazione per 30 minuti.
providers:
  claude-subscription-directsdk-experimental:
    stale_timeout_seconds: 900

platform_toolsets:
  cli: [file, terminal, skills, todo, memory]
  # WebUI (ROOM-009) via API del gateway: si può chiedere un sync a mano.
  api_server: [file, terminal, skills, todo, memory]

terminal:
  backend: "local"
  cwd: "/opt/data/work"
  env_passthrough: [GH_TOKEN]

skills:
  external_dirs:
    - /opt/dojo/flows
    - /opt/dojo/skills

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  # Mai, nemmeno con approvazione: il merge e le operazioni distruttive
  # restano del workflow del fork e tue.
  deny:
    - "gh pr merge*"
    - "gh repo delete*"
    - "gh api * -X DELETE*"
    - "gh release*"
    - "gh workflow run*"
    - "git push --force*"
    - "git push -f*"
    - "git push * main"
    - "git push origin HEAD:main*"

# Login della CLI di Claude nel volume della room (`dojo.sh claude`), niente
# telemetria. conduit_push (ROOM-015): le notifiche del cron arrivano sull'app
# iOS Conduit; una risposta `[SILENT]` non notifica.
plugins:
  enabled: [conduit_push]
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        claude_config_dir: /opt/data/claude
        claude_code_telemetry: false
