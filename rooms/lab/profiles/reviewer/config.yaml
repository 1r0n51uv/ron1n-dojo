# Reviewer (L): rivede le PR contro la specifica e le regole del flusso, e
# commenta o chiede modifiche. Niente toolset `file`, e il suo token GitHub
# ha i contenuti in sola lettura: non può cambiare il codice né fare merge.
model:
  # Abbonamento Claude (MODELS-006). Si cambia da Hermes (`hermes model`,
  # dashboard o WebUI) e l'aggiornamento dell'immagine non lo tocca
  # (MODELS-007, ROOM-012).
  provider: "claude-subscription-directsdk-experimental"
  default: "sonnet"
  context_length: 200000

# Una chiamata appesa senza output non tiene ferma una card per 30 minuti.
providers:
  claude-subscription-directsdk-experimental:
    stale_timeout_seconds: 900

platform_toolsets:
  telegram: [terminal, kanban, clarify, skills, todo, memory, mcp-atlassian]
  cli: [terminal, kanban, clarify, skills, todo, memory, mcp-atlassian]
  # WebUI (ROOM-009) via API del gateway.
  api_server: [terminal, kanban, clarify, skills, todo, memory, mcp-atlassian]

terminal:
  backend: "local"
  cwd: "/opt/data/work"
  env_passthrough: [GH_TOKEN]

skills:
  external_dirs:
    - /opt/dojo/flows
    - /opt/dojo/skills

# Jira (TRACKER-002): il server MCP atlassian è nell'immagine a versione
# fissata. Account e token vengono da dojo.env; senza token i tool rispondono
# con un errore e la skill tracker-jira fa fermare l'agente.
mcp_servers:
  atlassian:
    command: /opt/hermes/.venv/bin/python
    args: ["-c", "from mcp_atlassian import main; main()"]
    env:
      PYTHONPATH: /opt/mcp-atlassian
      JIRA_URL: "${JIRA_URL}"
      JIRA_USERNAME: "${JIRA_USERNAME}"
      JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
    tools:
      include: [get_issue, search, create_issue, update_issue, add_comment, get_transitions, transition_issue]
      resources: false
      prompts: false

kanban:
  dispatch_in_gateway: false

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  # Mai, nemmeno con approvazione: il merge e le operazioni distruttive
  # restano tue.
  deny:
    - "gh pr merge*"
    - "gh repo delete*"
    - "gh api * -X DELETE*"
    - "git push --force*"
    - "git push -f*"
    - "git push * main"
    - "git push origin HEAD:main*"

# Login della CLI di Claude nel volume della room (`dojo.sh claude`), niente
# telemetria.
plugins:
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        claude_config_dir: /opt/data/claude
        claude_code_telemetry: false
