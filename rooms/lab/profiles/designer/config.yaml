# Designer (Bulma): design, mockup, flows e specifiche UI/UX, anche revisione di un
# progetto esistente; passa il lavoro al Builder con issue. Non scrive codice.
model:
  # Nome logico del gateway dei modelli (services/models/config.yaml).
  provider: "custom"
  base_url: "http://litellm:4000/v1"
  key_env: LITELLM_API_KEY
  default: "strong"
  context_length: 200000

platform_toolsets:
  telegram: [file, terminal, vision, kanban, clarify, skills, todo, memory]
  cli: [file, terminal, vision, kanban, clarify, skills, todo, memory]

terminal:
  backend: "local"
  cwd: "/opt/data/work"
  env_passthrough: [GH_TOKEN]

skills:
  external_dirs:
    - /opt/dojo/flows

kanban:
  dispatch_in_gateway: false

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  # Mai, nemmeno con approvazione: il merge e le operazioni distruttive
  # restano tue.
  deny:
    - "gh pr merge*"
    - "gh repo delete*"
    - "gh api * -X DELETE*"
    - "git push --force*"
    - "git push -f*"
    - "git push * main"
    - "git push origin HEAD:main*"
