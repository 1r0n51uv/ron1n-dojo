# Profilo default della room: non parla con nessuno (niente bot), ospita il
# gateway che serve tutti i profiles e il dispatcher del board Kanban.
model:
  # Nome logico del gateway dei modelli (services/models/config.yaml).
  provider: "custom"
  base_url: "http://litellm:4000/v1"
  key_env: LITELLM_API_KEY
  default: "fast"
  context_length: 200000

gateway:
  multiplex_profiles: true

kanban:
  dispatch_in_gateway: true

platform_toolsets:
  cli: [kanban, clarify]
  # Nessun client ACP usa il default (dojo-acp lo rifiuta), ma se ci arriva
  # ha gli stessi tool della CLI, non il toolset hermes-acp (ROOM-008).
  acp: [kanban, clarify]

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny

# Riepilogo su Telegram quando una card parte, finisce o si blocca
# (rooms/lab/plugins/kanban-telegram) e chat che passa all'agente che prende
# la card (rooms/lab/plugins/handoff, solo qui: gira nel dispatcher).
plugins:
  enabled: [kanban-telegram, handoff]
