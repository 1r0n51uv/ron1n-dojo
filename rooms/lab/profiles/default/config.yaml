# Profilo default della room: non parla con nessuno (niente bot), ospita il
# gateway che serve tutti i profiles e il dispatcher del board Kanban.
model:
  # Abbonamento Claude (MODELS-006). Si cambia da Hermes (`hermes model`,
  # dashboard o WebUI) e l'aggiornamento dell'immagine non lo tocca
  # (MODELS-007, ROOM-012).
  provider: "claude-subscription-directsdk-experimental"
  default: "sonnet"
  context_length: 200000

# Una chiamata appesa senza output non tiene ferma una card per 30 minuti.
providers:
  claude-subscription-directsdk-experimental:
    stale_timeout_seconds: 900

gateway:
  multiplex_profiles: true

kanban:
  dispatch_in_gateway: true

platform_toolsets:
  cli: [kanban, clarify]
  api_server: [kanban, clarify]

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny

# dojo-handoff (FLOW-005, rooms/lab/plugins): il dispatcher gira qui, e quando
# un agente prende una card gli intesta gli avvisi della chat dell'utente.
# Login della CLI di Claude nel volume della room (`dojo.sh claude`), niente
# telemetria.
plugins:
  enabled: [dojo-handoff]
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        claude_config_dir: /opt/data/claude
        claude_code_telemetry: false
