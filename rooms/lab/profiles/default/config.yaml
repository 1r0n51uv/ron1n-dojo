# Profilo default della room: non parla con nessuno, ospita il
# gateway che serve tutti i profiles e il dispatcher del board Kanban.
model:
  # Abbonamento Claude (MODELS-006). Si cambia da Hermes (`hermes model`,
  # dashboard o WebUI) e l'aggiornamento dell'immagine non lo tocca
  # (MODELS-007, ROOM-012).
  provider: "claude-subscription-directsdk-experimental"
  default: "sonnet"
  context_length: 200000

# Una chiamata appesa senza output non tiene ferma una card per 30 minuti.
providers:
  claude-subscription-directsdk-experimental:
    stale_timeout_seconds: 900

gateway:
  multiplex_profiles: true

kanban:
  dispatch_in_gateway: true
  # Reviewer accantonato (FLOW-001): nessuna card passa in review da sola.
  # Riaccendilo qui e in DOJO_AGENTS quando L torna nel flusso.
  review_dispatch: false

# conduit: i tool del plugin conduit_push (ROOM-015).
platform_toolsets:
  cli: [kanban, clarify, conduit]
  api_server: [kanban, clarify, conduit]

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny

# Login della CLI di Claude nel volume della room (`dojo.sh claude`), niente
# telemetria. conduit_push (ROOM-015): notifiche all'app iOS Conduit; il
# plugin lo installa Conduit in /opt/data/plugins, qui resta acceso anche
# dopo un riavvio o un'immagine nuova.
plugins:
  enabled: [conduit_push]
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        claude_config_dir: /opt/data/claude
        claude_code_telemetry: false
