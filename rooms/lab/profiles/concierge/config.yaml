# Concierge (Nico Robin): primo contatto con 1ron51uv, capisce cosa serve e passa il lavoro
# agli altri agenti con card Kanban. Non scrive file, non ha shell né GitHub.
# Prima di smistare chiarisce la richiesta con la skill grilling (skills/).
model:
  # Nome logico del gateway dei modelli (services/models/config.yaml).
  provider: "custom"
  base_url: "http://litellm:4000/v1"
  key_env: LITELLM_API_KEY
  default: "strong"
  context_length: 200000

platform_toolsets:
  telegram: [kanban, clarify, skills, todo, memory]
  cli: [kanban, clarify, skills, todo, memory]
  # Client ACP sul PC, come AionUi (ROOM-008): stessi tool della CLI.
  acp: [kanban, clarify, skills, todo, memory]
  # Interfaccia web (hermes-webui, ROOM-009) via API del gateway.
  api_server: [kanban, clarify, skills, todo, memory]

skills:
  external_dirs:
    - /opt/dojo/flows
    - /opt/dojo/skills

kanban:
  dispatch_in_gateway: false

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  # Mai, nemmeno con approvazione: il merge e le operazioni distruttive
  # restano tue.
  deny:
    - "gh pr merge*"
    - "gh repo delete*"
    - "gh api * -X DELETE*"
    - "git push --force*"
    - "git push -f*"
    - "git push * main"
    - "git push origin HEAD:main*"

# Riepilogo su Telegram quando una card parte, finisce o si blocca
# (rooms/lab/plugins/kanban-telegram).
plugins:
  enabled: [kanban-telegram]
