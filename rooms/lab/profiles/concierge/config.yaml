# Concierge (Nico Robin): primo contatto con 1ron51uv, capisce cosa serve e passa il lavoro
# agli altri agenti con card Kanban. Non scrive file, non ha shell né GitHub.
# Prima di smistare chiarisce la richiesta con la skill grilling (skills/).
model:
  # Abbonamento Claude (MODELS-006). Si cambia da Hermes (`hermes model`,
  # dashboard o WebUI) e l'aggiornamento dell'immagine non lo tocca
  # (MODELS-007, ROOM-012).
  provider: "claude-subscription-directsdk-experimental"
  default: "sonnet"
  context_length: 200000

# Una chiamata appesa senza output non tiene ferma una card per 30 minuti.
providers:
  claude-subscription-directsdk-experimental:
    stale_timeout_seconds: 900

platform_toolsets:
  telegram: [kanban, clarify, skills, todo, memory]
  cli: [kanban, clarify, skills, todo, memory]
  # WebUI (ROOM-009) via API del gateway.
  api_server: [kanban, clarify, skills, todo, memory]

skills:
  external_dirs:
    - /opt/dojo/flows
    - /opt/dojo/skills

kanban:
  dispatch_in_gateway: false

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  # Mai, nemmeno con approvazione: il merge e le operazioni distruttive
  # restano tue.
  deny:
    - "gh pr merge*"
    - "gh repo delete*"
    - "gh api * -X DELETE*"
    - "git push --force*"
    - "git push -f*"
    - "git push * main"
    - "git push origin HEAD:main*"

# Login della CLI di Claude nel volume della room (`dojo.sh claude`), niente
# telemetria.
plugins:
  entries:
    claude-subscription-directsdk-experimental:
      settings:
        claude_config_dir: /opt/data/claude
        claude_code_telemetry: false
