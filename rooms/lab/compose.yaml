# room lab: i cinque agenti di sviluppo in un solo container Hermes, un
# profile per agente. Il container è il confine di sicurezza: niente
# docker.sock, egress solo verso i domini di egress/allowlist.conf, nessuna
# porta pubblicata tranne dashboard e WebUI su 127.0.0.1. L'immagine arriva
# da GHCR (ROOM-010) e Watchtower la aggiorna. Si avvia con scripts/dojo.sh,
# che imposta DOJO_UID, DOJO_GID e DOJO_WORK. Spec: docs/specs/rooms.md.
name: dojo-lab

x-image: &image
  image: ghcr.io/1r0n51uv/dojo-lab:${DOJO_TAG:-main}
  labels:
    com.centurylinklabs.watchtower.enable: "true"

services:
  hermes:
    <<: *image
    restart: unless-stopped
    command: ["gateway", "run"]
    # Dashboard di Hermes: si accende solo se esiste dashboard.env, che dojo.sh
    # crea con utente e password casuali (ROOM-006).
    env_file:
      - path: ./dashboard.env
        required: false
    environment:
      # File degli agenti di proprietà dell'utente del mini PC (ROOM-011).
      HERMES_UID: ${DOJO_UID:-1000}
      HERMES_GID: ${DOJO_GID:-1000}
      # Tutto il traffico esce dal proxy con l'allowlist.
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
      # Gli IP di riserva di Telegram scavalcano i nomi a dominio: il proxy
      # li rifiuterebbe.
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
      # API del gateway per la WebUI (ROOM-009), solo sulla rete internal. La
      # chiave sta nel .env di ogni profile: senza chiave l'API non parte.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      # CLI di Claude dell'abbonamento (MODELS-006): niente aggiornamenti
      # automatici né traffico non essenziale.
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      - data:/opt/data
      # Cartella di lavoro degli agenti, sul mini PC (ROOM-011).
      - ${DOJO_WORK:?imposta DOJO_WORK o usa scripts/dojo.sh}:/opt/data/work
    networks:
      - internal
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    depends_on:
      - egress

  # Unico ingresso dall'host alla dashboard di Hermes: inoltra
  # 127.0.0.1:9119 a hermes, che sta su una rete senza internet. Solo TCP.
  # Da un'altra macchina: tunnel SSH.
  dashboard:
    image: alpine/socat:1.8.1.1
    restart: unless-stopped
    command: ["TCP-LISTEN:9119,fork,reuseaddr", "TCP:hermes:9119"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-9119}:9119"
    networks:
      - internal
      - dashboard
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    depends_on:
      - hermes

  # WebUI hermes-webui (ROOM-009). Le chat passano dall'API del gateway,
  # quindi i tool degli agenti girano nel container hermes con i loro
  # toolset; qui restano i pannelli (sessioni, memoria, Kanban). Stessa
  # immagine e stesso volume di hermes, solo rete internal. Senza webui.env
  # (lo crea dojo.sh) resta ferma.
  webui:
    <<: *image
    restart: unless-stopped
    user: "${DOJO_UID:-1000}:${DOJO_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -z "$$HERMES_WEBUI_PASSWORD" ]; then
        echo "webui: manca webui.env, lancia dojo.sh up"; exec sleep infinity; fi;
        exec /opt/hermes/.venv/bin/python /opt/hermes-webui/server.py
    env_file:
      - path: ./webui.env
        required: false
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      HERMES_WEBUI_AGENT_DIR: /opt/hermes
      # PyYAML della WebUI, fuori dalla venv di Hermes (Dockerfile).
      PYTHONPATH: /opt/hermes-webui/deps
      HERMES_WEBUI_STATE_DIR: /opt/data/webui
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      # Da fuori casa si arriva da Cloudflare e Caddy in HTTPS: il cookie
      # diventa Secure quando Caddy lo dice.
      HERMES_WEBUI_TRUST_FORWARDED_PROTO: "1"
      # Le chat vanno al gateway (runs API, con le approvazioni), mai al
      # runtime interno della WebUI.
      HERMES_WEBUI_CHAT_BACKEND: gateway
      HERMES_WEBUI_GATEWAY_BASE_URL: http://hermes:8642
      HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,hermes
    volumes:
      - data:/opt/data
    networks:
      - internal
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      - hermes

  # Ingresso della WebUI: 127.0.0.1:8787 in casa e `dojo-webui:8787` sulla
  # rete proxy di ron1n, dove Caddy la pubblica su dojo.ron1n.space dietro
  # Cloudflare Access. Solo TCP, non vede il contenuto.
  webui-proxy:
    image: alpine/socat:1.8.1.1
    restart: unless-stopped
    command: ["TCP-LISTEN:8787,fork,reuseaddr", "TCP:webui:8787"]
    ports:
      - "127.0.0.1:${WEBUI_PORT:-8787}:8787"
    networks:
      internal: {}
      dashboard: {}
      proxy:
        aliases: [dojo-webui]
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    depends_on:
      - webui

  egress:
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    volumes:
      - ./egress:/etc/squid/conf.d:ro
    networks:
      - internal
      - external
    mem_limit: 256m

volumes:
  data:

networks:
  # Nessuna rotta verso internet: Hermes esce solo passando da egress.
  internal:
    internal: true
  external: {}
  # Solo per pubblicare dashboard e WebUI su 127.0.0.1.
  dashboard: {}
  # Rete di Caddy (stack proxy di ron1n); dojo.sh la crea se manca.
  proxy:
    name: proxy
    external: true
