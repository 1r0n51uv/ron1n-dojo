# Revisore: rivede le PR contro la specifica e le regole del flusso, e
# commenta o chiede modifiche. Niente toolset `file`, e il suo token GitHub
# ha i contenuti in sola lettura: non può cambiare il codice né fare merge.
model:
  provider: "anthropic"
  default: "claude-opus-5-5"

platform_toolsets:
  telegram: [terminal, kanban, clarify, skills, todo, memory]
  cli: [terminal, kanban, clarify, skills, todo, memory]

terminal:
  backend: "local"
  cwd: "/opt/data/lavori"
  env_passthrough: [GH_TOKEN]

skills:
  external_dirs:
    - /opt/dojo/flussi

kanban:
  dispatch_in_gateway: false

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  # Mai, nemmeno con approvazione: il merge e le operazioni distruttive
  # restano tue.
  deny:
    - "gh pr merge*"
    - "gh repo delete*"
    - "gh api * -X DELETE*"
    - "git push --force*"
    - "git push -f*"
    - "git push * main"
    - "git push origin HEAD:main*"
