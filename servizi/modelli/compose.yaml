# Gateway dei modelli del dojo: LiteLLM davanti a tutti i provider (cloud,
# piani free, Ollama locale). Le chiavi vere stanno solo qui; ogni stanza
# ha una chiave virtuale con budget e una rete sua verso questo servizio,
# così le stanze non si vedono fra loro. Spec: docs/specs/modelli.md.
name: dojo-modelli

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      # Modelli e chiavi si gestiscono da config.yaml e dall'API, non dalla UI.
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - db
      - esterna
      # Le reti delle stanze (dojo-<stanza>-modelli) le collega dojo.sh
      # all'avvio: una stanza nuova non richiede modifiche qui.
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - db
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Modelli locali, spenti finché non serve: `docker compose --profile
  # locale up -d`. Il mini PC non ha GPU: solo modelli piccoli.
  ollama:
    image: ollama/ollama:0.40.12
    restart: unless-stopped
    profiles: [locale]
    environment:
      # Hermes ha bisogno di contesto lungo; il default di Ollama è 4096.
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama:/root/.ollama
    networks:
      - esterna
    mem_limit: 8g

volumes:
  db:
  ollama:

networks:
  db:
    internal: true
  esterna: {}
