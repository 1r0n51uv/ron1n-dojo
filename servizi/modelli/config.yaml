# Modelli che le stanze possono chiedere, per nome logico. Una stanza
# chiede `forte`, `veloce` o `gratis` e LiteLLM sceglie il provider; se uno
# fallisce o finisce la quota passa al successivo (router_settings.fallbacks).
# Un provider senza chiave nel .env resta in elenco ma fallisce, e si passa
# oltre.

model_list:
  # Per specifiche, codice e review.
  - model_name: forte
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: forte-riserva
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8
      api_key: os.environ/OPENROUTER_API_KEY

  # Per il lavoro di tutti i giorni.
  - model_name: veloce
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: veloce-riserva
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY

  # Piani free: digest, riassunti, cron. Limiti di richieste bassi.
  - model_name: gratis
    litellm_params:
      model: openrouter/inclusionai/ring-2.6-1t:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gratis-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: gratis-gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Ollama sul mini PC (profilo `locale` del compose).
  - model_name: locale
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://ollama:11434

# Catene complete: con le sole chiavi gratuite (OpenRouter, Groq, Gemini) o
# solo Ollama il dojo funziona lo stesso, più lento e meno preciso.
router_settings:
  num_retries: 1
  fallbacks:
    - forte: [forte-riserva, veloce, veloce-riserva, gratis, gratis-groq, gratis-gemini, locale]
    - veloce: [veloce-riserva, gratis, gratis-groq, gratis-gemini, locale]
    - gratis: [gratis-groq, gratis-gemini, locale]

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
