# Profilo default della stanza: non parla con nessuno (niente bot), ospita il
# gateway che serve tutti i profili e il dispatcher del board Kanban.
model:
  # Nome logico del gateway dei modelli (servizi/modelli/config.yaml).
  provider: "custom"
  base_url: "http://litellm:4000/v1"
  key_env: LITELLM_API_KEY
  default: "veloce"
  context_length: 200000

gateway:
  multiplex_profiles: true

kanban:
  dispatch_in_gateway: true

platform_toolsets:
  cli: [kanban, clarify]

approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
