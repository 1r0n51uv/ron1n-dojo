# stanza lab: gli agenti di sviluppo (strategist, builder, reviewer) in un
# solo container Hermes, un profilo per agente. Il container è il confine di
# sicurezza: niente docker.sock, uscita solo verso i domini di
# uscita/allowlist.conf, nessuna porta pubblicata tranne la dashboard su
# 127.0.0.1 (servizio pannello). Spec: docs/specs/stanze.md.
name: dojo-lab

services:
  hermes:
    build:
      context: .
      args:
        HERMES_VERSION: v0.22.5
    image: dojo-lab:v0.22.5
    restart: unless-stopped
    command: ["gateway", "run"]
    # Dashboard di Hermes: si accende solo se esiste pannello.env, che dojo.sh
    # sync crea con utente e password casuali. Senza credenziali Hermes non
    # la avvia (nessun accesso senza autenticazione).
    env_file:
      - path: ./pannello.env
        required: false
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      # Tutto il traffico esce dal proxy con l'allowlist.
      HTTPS_PROXY: http://uscita:3128
      HTTP_PROXY: http://uscita:3128
      NO_PROXY: localhost,127.0.0.1,litellm
      # Gli IP di riserva di Telegram scavalcano i nomi a dominio: il proxy
      # li rifiuterebbe.
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
    volumes:
      - dati:/opt/data
      # Flussi in sola lettura: gli agenti li usano ma non li modificano.
      - ../../flussi:/opt/dojo/flussi:ro
    networks:
      - interna
      # Solo verso il gateway dei modelli (servizi/modelli).
      - modelli
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    depends_on:
      - uscita

  # Unico ingresso dall'host: inoltra 127.0.0.1:9119 alla dashboard di Hermes,
  # che sta su una rete senza internet e dove l'host non arriva. Solo TCP, non
  # vede il contenuto. Da un'altra macchina: tunnel SSH verso la porta.
  pannello:
    image: alpine/socat:1.8.1.1
    restart: unless-stopped
    command: ["TCP-LISTEN:9119,fork,reuseaddr", "TCP:hermes:9119"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-9119}:9119"
    networks:
      - interna
      - pannello
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    depends_on:
      - hermes

  uscita:
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    volumes:
      - ./uscita/allowlist.conf:/etc/squid/conf.d/dojo.conf:ro
    networks:
      - interna
      - esterna
    mem_limit: 256m

volumes:
  dati:

networks:
  # Nessuna rotta verso internet: Hermes esce solo passando da uscita.
  interna:
    internal: true
  esterna: {}
  # Solo per pubblicare la porta della dashboard su 127.0.0.1.
  pannello: {}
  modelli:
    name: dojo-lab-modelli
    external: true
